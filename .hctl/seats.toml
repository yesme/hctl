# hctl 席位声明 — 零号采用者（schema/seats.schema.json v1）
# 本文件是 D-37 的 coordinator_config 单文件源：merge claim 钉其 {commit,path,blob}。
# 跨字段规则（pattern 两两不相交、coordinator 存在且 canonical 等）由 loader/doctor 校验。
# enforcement=bootstrap：级④信任期，自开自合例外生效；P1 交付时经 gated PR 置 active（D-38）。

schema_version    = 1
kernel            = "hctl@bootstrap"
merge_coordinator = "claude"
enforcement       = "bootstrap"

[seats.claude]
harness               = "claude-code"
model                 = "fable-5"
capabilities          = ["vision", "architecture", "planning", "narrative"]
write_scope           = "canonical"
author_concurrency    = 1
author_branch_patterns = ["refs/heads/work/claude/*", "refs/heads/claude/*"]
memo_branch_patterns   = ["refs/heads/memo/claude/*"]
token_class           = "full"
coauthor_email        = "281844019+a-claude-code-bot[bot]@users.noreply.github.com"

[seats.claude.features]
session_resume    = "yes"
parallel_sessions = "yes"
subagents         = "yes"
skill             = "native"
door_file         = "CLAUDE.md"

[seats.codex]
harness               = "openai-codex"
model                 = "gpt-5.6"
capabilities          = ["logic", "spec-precision", "implementation", "verification"]
write_scope           = "canonical"
author_concurrency    = 1
author_branch_patterns = ["refs/heads/work/codex/*", "refs/heads/codex/*"]
memo_branch_patterns   = ["refs/heads/memo/codex/*"]
token_class           = "full"
coauthor_email        = "281847692+a-chatgpt-codex-bot[bot]@users.noreply.github.com"

[seats.codex.features]
session_resume    = "unknown"
parallel_sessions = "unknown"
subagents         = "unknown"
skill             = "unknown"
door_file         = "AGENTS.md"      # 实测：直读共享正文（codex-2026-07-27.md ⑬）

[seats.grok]
harness               = "grok-build"
model                 = "grok-4.5"
capabilities          = ["adversarial-review", "general-gate", "efficiency"]
write_scope           = "canonical"
author_concurrency    = 1
author_branch_patterns = ["refs/heads/work/grok/*", "refs/heads/grok/*"]
memo_branch_patterns   = ["refs/heads/memo/grok/*"]
token_class           = "full"
coauthor_email        = "302482056+a-grok-build-bot[bot]@users.noreply.github.com"

[seats.grok.features]
session_resume    = "unknown"
parallel_sessions = "unknown"
subagents         = "unknown"
skill             = "unknown"        # 有 bundled skills 体系，hctl 薄壳挂载待实测（grok-2026-07-27.md ⑬）
door_file         = "AGENTS.md"      # 实测：工作区 pointer 生效
